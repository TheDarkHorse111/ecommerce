server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    active: local
  config:
    import: "configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  cloud:
    stream:
      binders:
        bus:
          type: kafka
          environment:
            spring:
              cloud:
                stream:
                  kafka:
                    binder:
                      brokers: localhost:9092
      bindings:
        springCloudBusInput:
          binder: bus
        springCloudBusOutput:
          binder: bus
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog
              uri: lb://catalog-service
              predicates:
                - Path=/catalog/**
              filters:
                - StripPrefix=1

management:
  endpoint:
    env:
      show-values: ALWAYS
  endpoints:
    web:
      exposure:
        include: env
