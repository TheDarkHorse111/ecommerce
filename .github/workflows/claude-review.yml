name: Claude Review

on:
  pull_request:
    types: [ opened, synchronize ]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Open Code Review
        run: npm install -g @alibaba-group/open-code-review@1.12.6
      - name: Fetch the Open Code Review plugin
        run: git clone --depth 1 --branch v1.12.6 https://github.com/alibaba/open-code-review.git "$RUNNER_TEMP/open-code-review"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          track_progress: true
          additional_permissions: |
            actions: read
          claude_args: |
            --plugin-dir ${{ runner.temp }}/open-code-review/plugins/open-code-review/claude-code
            --allowedTools "Bash(mvn:*),Bash(git:*),Bash(gh:*),Bash(ocr:*),mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Step 4 of delegate-review is overridden. Never fix, never edit a file, never commit and never push. Every rule returned by ocr delegate rule names .github/review-criteria.md, so read it and apply it in full. Publish each surviving High and Medium finding as an inline comment on the line it points at, and post nothing if nothing survives verification."
          prompt: |
            /open-code-review:delegate-review --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Report denied tools
        if: always()
        run: bash .github/report-denials.sh
