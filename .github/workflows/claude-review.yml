name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(mvn:*),Bash(git:*),Bash(gh:*)"
          prompt: |
            Read .github/review-criteria.md and review this pull request by it.
